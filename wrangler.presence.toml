name = "swyxdotio-presence"
account_id = "2d017c943ff16e4c52783635ef05e535"
main = "workers/presence/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "web_socket_auto_reply_to_close"]

# PresenceRoom does not use object storage. ChatRoom has its own namespace and
# stores its ephemeral message history in SQLite.
[[durable_objects.bindings]]
name = "PRESENCE_ROOMS"
class_name = "PresenceRoom"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[ratelimits]]
name = "CHAT_MESSAGE_RATE_LIMITER"
namespace_id = "41006"

  [ratelimits.simple]
  limit = 20
  period = 60

[[d1_databases]]
binding = "READ_COUNTERS"
database_name = "swyxdotio-read-counters"
database_id = "9990fd0c-2211-4bf4-b263-ddbb8aaed34e"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChatRoom"]
